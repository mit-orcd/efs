# Short IOR-only smoke through the IO-500 driver.
# Stonewall 1s → official score is INVALID (expected). For wiring checks.
# datadir/resultdir are rewritten by run.sh for the live FUSE mount.

[global]
datadir = /tmp/efs-mount/io500
resultdir = /tmp/efs-mount/io500-results
timestamp-datadir = TRUE
timestamp-resultdir = TRUE
api = POSIX
verbosity = 1

[debug]
stonewall-time = 1

[ior-easy]
transferSize = 1m
blockSize = 16g
filePerProc = TRUE
uniqueDir = FALSE
run = TRUE

[ior-easy-write]
run = TRUE

[ior-easy-read]
run = TRUE

[ior-hard]
segmentCount = 100000
run = TRUE

[ior-hard-write]
run = TRUE

[ior-hard-read]
run = TRUE

[mdtest-easy]
run = TRUE

[mdtest-easy-write]
run = TRUE

[mdtest-easy-stat]
run = TRUE

[mdtest-easy-delete]
run = TRUE

[mdtest-hard]
run = TRUE

[mdtest-hard-write]
run = TRUE

[mdtest-hard-stat]
run = TRUE

[mdtest-hard-read]
run = TRUE

[mdtest-hard-delete]
run = TRUE

[find]
run = FALSE

[find-easy]
run = FALSE

[find-hard]
run = FALSE

[ior-rnd4K-easy-read]
run = FALSE
