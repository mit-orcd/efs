# IOR easy + hard only, via the IO-500 driver (mdtest/find off).
# Default stonewall 30s — not a valid IO-500 submission (needs 300s + all phases).
# Raise STONEWALL=300 when you want a longer write; raise blockSize if the
# write finishes before the stonewall.
# datadir/resultdir are rewritten by run.sh for the live FUSE mount.

[global]
datadir = /tmp/efs-mount/io500
resultdir = ./results-ior
timestamp-datadir = TRUE
timestamp-resultdir = TRUE
api = POSIX
verbosity = 1

[debug]
stonewall-time = 30

[ior-easy]
transferSize = 1m
blockSize = 64g
filePerProc = TRUE
uniqueDir = FALSE
run = TRUE

[ior-easy-write]
run = TRUE

[ior-easy-read]
run = TRUE

[ior-hard]
segmentCount = 1000000
run = TRUE

[ior-hard-write]
run = TRUE

[ior-hard-read]
run = TRUE

[mdtest-easy]
run = FALSE

[mdtest-easy-write]
run = FALSE

[mdtest-easy-stat]
run = FALSE

[mdtest-easy-delete]
run = FALSE

[mdtest-hard]
run = FALSE

[mdtest-hard-write]
run = FALSE

[mdtest-hard-stat]
run = FALSE

[mdtest-hard-read]
run = FALSE

[mdtest-hard-delete]
run = FALSE

[find]
run = FALSE

[find-easy]
run = FALSE

[find-hard]
run = FALSE

[ior-rnd4K-easy-read]
run = FALSE
